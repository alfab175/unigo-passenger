plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.unigo.passenger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.unigo.passenger'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

flutter {
    source '../..'
}
