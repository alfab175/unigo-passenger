name: UNIGO Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Configure Android local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Inject Google Maps key when provided
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          if [ -n "$GOOGLE_MAPS_ANDROID_KEY" ]; then
            sed -i "s|REPLACE_WITH_GOOGLE_MAPS_KEY|${GOOGLE_MAPS_ANDROID_KEY}|g" \\
              android/app/src/main/res/values/strings.xml
          fi
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unigo-passenger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
